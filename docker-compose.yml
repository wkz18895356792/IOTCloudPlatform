  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #     - MQTT_HOST=${MQTT_HOST}
  #     - MQTT_PORT=${MQTT_PORT}
  #     - REDIS_HOST=${REDIS_HOST}
  #     - REDIS_PORT=${REDIS_PORT}
  #     - REDIS_PASSWORD=${REDIS_PASSWORD}
  #     - DEVICE_SECRET=${DEVICE_SECRET}
  #   depends_on:
