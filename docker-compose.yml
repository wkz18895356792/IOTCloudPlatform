version: '3.8'

services:
  # ==================== 基础设施 ====================

  # MySQL 数据库
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: baby-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/user-service.sql:/docker-entrypoint-initdb.d/02-user-service.sql
      - ./database/baby-service.sql:/docker-entrypoint-initdb.d/03-baby-service.sql
      - ./database/device-service-extended.sql:/docker-entrypoint-initdb.d/04-device-service-extended.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存和消息队列
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: baby-monitor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EMQX MQTT Broker
  emqx:
    image: docker.m.daocloud.io/emqx/emqx:5.4.0
    container_name: baby-monitor-emqx
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=emqx
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USERNAME}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
      # MQTT/SSL Listener 配置 — 挂载证书后自动启用
      - EMQX_LISTENERS__SSL__DEFAULT__ENABLE=${EMQX_SSL_ENABLED:-false}
      - EMQX_LISTENERS__SSL__DEFAULT__BIND=8883
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE=/opt/emqx/etc/certs/emqx.key
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE=/opt/emqx/etc/certs/emqx.crt
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE=/opt/emqx/etc/certs/ca.crt
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY=${EMQX_SSL_VERIFY:-verify_none}
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # WebSocket
      - "8883:8883"     # MQTT/SSL
      - "8084:8084"     # WebSocket/SSL
      - "18083:18083"   # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./certs/emqx:/opt/emqx/etc/certs:ro
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: baby-monitor-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 微服务 ====================

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: baby-monitor-api-gateway
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - USER_SERVICE_URL=http://user-service:6002
      - DEVICE_SERVICE_URL=http://device-service:6003
      - BABY_SERVICE_URL=http://baby-service:6008
      - VIDEO_SERVICE_URL=http://video-service:6004
      - STORAGE_SERVICE_URL=http://storage-service:6005
      - DEVICE_GATEWAY_URL=http://device-gateway:6010
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      baby-service:
        condition: service_healthy
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: baby-monitor-user-service
    restart: unless-stopped
    ports:
      - "6002:6002"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SMS_ACCESS_KEY=${SMS_ACCESS_KEY}
      - SMS_SECRET_KEY=${SMS_SECRET_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Device Gateway (统一设备网关 - 整合了 MQTT Gateway 和 Protocol Adapter)
  # mqtt-gateway 和 protocol-adapter 已合并到此服务，不再单独部署
  device-gateway:
    build:
      context: ./services/device-gateway
      dockerfile: Dockerfile
    container_name: baby-monitor-device-gateway
    restart: unless-stopped
    ports:
      - "6010:6010"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DEVICE_SECRET=${DEVICE_SECRET}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - SERVICE_TIMEOUT=${SERVICE_TIMEOUT}
      - SERVICE_MAX_RETRIES=${SERVICE_MAX_RETRIES}
      - SERVICE_RETRY_DELAY=${SERVICE_RETRY_DELAY}
      - SESSION_KEYS=${SESSION_KEYS}
    depends_on:
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6010/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT Gateway (DEPRECATED - 已合并到 Device Gateway，不再维护)
