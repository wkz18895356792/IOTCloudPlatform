  # Admin Service (Domain Management)
  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: baby-monitor-admin-service
    restart: unless-stopped
    ports:
      - "6009:6009"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - baby-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6009/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 前端服务 ====================

  # Admin Dashboard (前端服务暂未实现)
  # 如需部署前端，请参考 deployment/ 目录下的前端部署文档

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  minio_data:
    driver: local

networks:
  baby-monitor-network:
    driver: bridge
