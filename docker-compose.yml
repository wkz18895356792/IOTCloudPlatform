  #     - MQTT_HOST=${MQTT_HOST}
  #     - MQTT_PORT=${MQTT_PORT}
  #     - REDIS_HOST=${REDIS_HOST}
  #     - REDIS_PORT=${REDIS_PORT}
  #     - REDIS_PASSWORD=${REDIS_PASSWORD}
  #     - DEVICE_SERVICE_URL=http://device-service:6003
  #   depends_on:
  #     emqx:
